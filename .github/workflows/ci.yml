name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run pointless; the suites are minutes
# long, so cancel rather than queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Diff-scoped on PRs (only the commits the PR introduces) and tree-scoped on
  # pushes: pre-publication history is accepted as-is and is not being purged,
  # so a full-history scan would be permanently red — and a permanently red
  # scanner is one everybody learns to ignore.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the PR base..head range below resolves.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
          # gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        # gitleaks exits 1 when it finds a leak. Each invocation below is
        # checked explicitly and OR'd into $failed rather than relying on `set
        # -e` across an if/else, so no branch can silently swallow a nonzero
        # exit; the step's own exit code is $failed, so a finding still fails
        # the job. `--redact` keeps any found secret out of the CI logs;
        # `--config` pins the repo's .gitleaks.toml rather than auto-discovery.
        #
        # Every path scans both a commit range and the checked-out tree,
        # because either alone misses cases the other catches:
        #   - PR range without `--no-merges`: a secret introduced only by a
        #     merge/conflict-resolution commit inside the PR must not be
        #     skipped.
        #   - PR tree scan: catches a secret already present at HEAD even if
        #     history scanning above has a blind spot (e.g. a shallow/rewritten
        #     ref), so the actual checked-out state is never unexamined.
        #   - push before..after range: catches a secret added and then
        #     removed within the same push, which a tree-only scan of the
        #     final state would never see.
        #   - push tree scan: catches a secret already committed before this
        #     push if the range scan is unavailable (first push on a ref,
        #     `before` is the all-zeros SHA).
        run: |
          failed=0

          if [ -n "$BASE_SHA" ]; then
            /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose \
              --log-opts "$BASE_SHA..$HEAD_SHA" . || failed=1
            /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose . || failed=1
          else
            zero_sha="0000000000000000000000000000000000000000"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
              /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose \
                --log-opts "$BEFORE_SHA..$AFTER_SHA" . || failed=1
            fi
            /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose . || failed=1
          fi

          exit "$failed"

  skill-lint:
    name: Skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint skills
        run: python3 bin/lint-skills.py

  # One job for every skill's tests, not one per skill: a matrix grows a new
  # required check each time a skill gains a suite, which is not sustainable as
  # the repo fills up. Discovery still keeps adding a suite free of workflow
  # edits — the convention is one file, `test/ci.sh` at the skill root, exiting
  # 0 only when everything passed.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          git --version
      - name: Run every skill test suite
        run: |
          set -uo pipefail
          # One convention, one glob: <skill>/test/ci.sh. Sorted for a stable
          # order; dotdirs excluded so .github never matches.
          mapfile -t suites < <(find . -type f -path './*/test/ci.sh' -not -path './.*' \
            | sed 's|^\./||' | sort)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo 'no skill test suites found'
            exit 0
          fi
          printf 'found %d suite(s)\n' "${#suites[@]}"

          rc=0
          failed=()
          for suite in "${suites[@]}"; do
            skill="${suite%/test/ci.sh}"
            printf '\n::group::%s\n' "$skill"
            # Keep going after a failure, so one red skill never hides another.
            bash "$suite" || { rc=1; failed+=("$skill"); }
            printf '::endgroup::\n'
          done

          printf '\n'
          if [ "$rc" -eq 0 ]; then
            printf '\033[32mall %d suite(s) passed\033[0m\n' "${#suites[@]}"
            printf 'All %d skill test suite(s) passed.\n' "${#suites[@]}" >>"$GITHUB_STEP_SUMMARY"
          else
            printf '\033[31mFAILED: %s\033[0m\n' "${failed[*]}"
            printf 'Failed skill test suite(s): %s\n' "${failed[*]}" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
